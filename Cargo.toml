[package]
name = "dancing-crab"
version = "0.1.0"
edition = "2021"
description = "A dancing 3D crab in the terminal, with ASCII and smooth Unicode graphics"
readme = "README.md"
license = "MIT"
keywords = ["ascii-art", "animation", "terminal", "graphics", "crab"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
crossterm = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "dancing-crab"
path = "src/main.rs"
