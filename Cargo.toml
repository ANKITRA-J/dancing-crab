[package]
name = "dancing-crab"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A 3D ASCII art animation of a dancing crab in the terminal"
readme = "README.md"
license = "MIT"
keywords = ["ascii-art", "animation", "terminal", "graphics", "crab"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
# No external dependencies - the project uses only standard library

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "dancing-crab"
path = "src/main.rs"